[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E402: imports not at top — normal for sys.path.insert() pattern in tests/web
# E701: multiple statements on one line — acceptable for compact dict/list builds
# E731: lambda assignment — used intentionally for color helpers
# E741: ambiguous variable name (l, O...) — rare, ignore globally
ignore = ["E402", "E701", "E731", "E741"]

# F401: unused imports — only ignore in __init__.py re-exports
[tool.ruff.lint.per-file-ignores]
"src/core/db.py" = ["F401"]        # psycopg2 imported for side-effects / type checks
"src/core/network.py" = ["F401"]   # ssl imported conditionally used
"src/web/**" = ["F401"]            # web modules do sys.path tricks
